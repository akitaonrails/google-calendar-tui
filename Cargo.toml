[package]
name = "google-calendar-tui"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
description = "A quiet read-only terminal agenda for Google Calendar via GNOME Online Accounts"
repository = "https://github.com/akitaonrails/google-calendar-tui"
readme = "README.md"
license = "MIT"
exclude = ["packaging/*", ".github/*"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/google-calendar-tui-linux-{ target-arch }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
icalendar = { version = "0.17", default-features = false, features = ["parser", "recurrence"] }
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
unicode-width = "0.2"
urlencoding = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
